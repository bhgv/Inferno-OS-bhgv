name: Native64 typed Sys formatter
on:
  push:
    branches: [experiment]
    paths:
      - '.github/workflows/native64-sys-format.yml'
      - 'limbo/**'
      - 'doc/dis64-native64-prefixes.md'
      - 'include/native64*.h'
      - 'include/interp.h'
      - 'libinterp/**'
      - 'lib9/**'
      - 'utils/tests/native64-*'
      - 'module/sys.m'
      - 'module/math.m'
      - 'emu/port/dis.c'
      - 'emu/port/errstr.c'
      - 'emu/port/chan.c'
      - 'os/port/dis.c'
      - 'os/port/proc.c'
      - 'os/port/chan.c'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native64-sys-format-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatter:
    name: Typed Sys ${{ matrix.arch }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host: ubuntu-22.04
            compiler: gcc
            runner: ''
            flags: '-O3 -g -DNDEBUG -fstrict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
          - arch: arm64
            host: ubuntu-22.04-arm
            compiler: gcc
            runner: ''
            flags: '-O3 -g -DNDEBUG -fstrict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
          - arch: riscv64
            host: ubuntu-22.04
            compiler: riscv64-linux-gnu-gcc
            runner: 'qemu-riscv64 -R 0x10000000000 -L /usr/riscv64-linux-gnu'
            flags: '-O3 -g -DNDEBUG -fstrict-aliasing'
    env:
      NATIVE64_ARCH: ${{ matrix.arch }}
      NATIVE64_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap fresh native Limbo
        run: |
          if [ "$NATIVE64_ARCH" = riscv64 ]; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
          fi
          MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/host-tools" sh makemk.sh
      - name: Check generated schemas and real typed formatter ownership
        env:
          CC: ${{ matrix.compiler }}
          NATIVE64_CFLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          python3 utils/tests/native64-prefix.py --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/prefix.log"
          python3 utils/tests/native64-arguments.py --formatter --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/formatter.log"
      - name: Check source compiler call-site memory safety
        if: matrix.arch == 'amd64'
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all' \
            MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/compiler-sanitized" sh makemk.sh
          python3 utils/tests/native64-callsites.py --limbo "$RUNNER_TEMP/compiler-sanitized/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/source-compiler.log"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        continue-on-error: true # A storage outage must not block later runtime test runs.
        if: always()
        with:
          name: typed-sys-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/prefix.log
            ${{ runner.temp }}/formatter.log
            ${{ runner.temp }}/source-compiler.log
          if-no-files-found: warn
          retention-days: 14
