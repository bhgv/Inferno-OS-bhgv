name: Native64 UTF and binding address checks
on:
  push:
    branches: [experiment]
    paths:
      - '.github/workflows/native64-utf-asan.yml'
      - 'libinterp/runt.c'
      - 'libinterp/tests/sys-utf.c'
      - 'libinterp/tests/sys-utf.py'
      - 'include/interp.h'
      - 'include/runt.h'
      - 'lib9/rune.c'
      - 'libinterp/disc.c'
      - 'utils/tests/native64-disc-binding.c'
      - 'utils/tests/native64-disc-binding.py'
      - 'libinterp/prefab.c'
      - 'libinterp/freetype.c'
      - 'libfreetype/**'
      - 'limbo/**'
      - 'makemk.sh'
      - 'libinterp/geom.c'
      - 'module/draw-native64.m'
      - 'utils/tests/native64-geometry*'
      - 'utils/tests/native64-draw-scalars.py'
      - 'utils/tests/native64-pixels*'
      - 'include/draw.h'
      - 'libdraw/**'
      - 'libmemdraw/**'
      - 'module/freetype-native64.m'
      - 'module/freetype.m'
      - 'module/draw.m'
      - 'module/sys.m'
      - 'include/native64-scalar-boot.h'
      - 'include/freetype/**'
      - 'utils/tests/native64-freetype*'
      - 'libinterp/tests/gui-type-maps.c'
      - 'libinterp/tests/gui-type-maps.py'
      - 'utils/tests/native64-graphics-init.c'
      - 'utils/tests/native64-graphics-init.py'
      - 'libinterp/draw.c'
      - 'utils/tests/native64-draw-init.c'
      - 'utils/tests/native64-draw-init.py'
      - 'utils/tests/native64-builtins.py'
      - 'libinterp/tests/loader-snapshots.c'
      - 'libinterp/tests/loader-snapshots.py'
      - 'utils/tests/native64-loader-branch.c'
      - 'utils/tests/native64-loader-branch.py'
      - 'utils/tests/native64-loader-init.c'
      - 'utils/tests/native64-loader-init.py'
      - 'libinterp/loader.c'
      - 'utils/tests/native64-loader-mode.c'
      - 'utils/tests/native64-loader-mode.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utf:
    name: Address ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the native C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Execute full optimized UTF oracle and wrong-count controls
        env:
          CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          uname -a
          python3 libinterp/tests/sys-utf.py 2>&1 | tee utf-asan.log
      - name: Execute static binding memory and refusal controls
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-disc-binding.py 2>&1 | tee binding-asan.log
          for control in mode jit image; do
            python3 utils/tests/native64-disc-binding.py --control "$control" 2>&1 | tee -a binding-asan.log
          done
      - name: Execute public Loader result and mode checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-mode.py 2>&1 | tee loader-mode-asan.log
          python3 utils/tests/native64-loader-mode.py --control 2>&1 | tee -a loader-mode-asan.log
      - name: Execute transactional Draw initialization checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-draw-init.py 2>&1 | tee draw-init-asan.log
          for control in retirement publication registration; do
            python3 utils/tests/native64-draw-init.py --control "$control" 2>&1 | tee -a draw-init-asan.log
          done
      - name: Execute transactional Loader initialization checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-init.py 2>&1 | tee loader-init-asan.log
          for control in retirement publication registration; do
            python3 utils/tests/native64-loader-init.py --control "$control" 2>&1 | tee -a loader-init-asan.log
          done
      - name: Execute checked Loader branch snapshots
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-branch.py 2>&1 | tee loader-branch-asan.log
          for control in width bounds; do
            python3 utils/tests/native64-loader-branch.py --control "$control" 2>&1 | tee -a loader-branch-asan.log
          done
      - name: Execute public Loader snapshot rollback
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 libinterp/tests/loader-snapshots.py 2>&1 | tee loader-snapshots-asan.log
      - name: Execute native graphical descriptor and ownership checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          for module in prefab freetype; do
            python3 utils/tests/native64-graphics-init.py --module "$module" 2>&1 | tee -a graphics-init-asan.log
            for control in retirement publication registration; do
              python3 utils/tests/native64-graphics-init.py --module "$module" --control "$control" 2>&1 | tee -a graphics-init-asan.log
            done
          done
          for control in face-map glyph-map; do
            python3 utils/tests/native64-graphics-init.py --module freetype --control "$control" 2>&1 | tee -a graphics-init-asan.log
          done
          python3 libinterp/tests/gui-type-maps.py 2>&1 | tee gui-type-maps-asan.log
      - name: Execute native Freetype transforms, rasters and vendored engine
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-freetype.py 2>&1 | tee freetype-bridge-asan.log
          for control in vm-transform native-transform pitch limits result sort; do
            python3 utils/tests/native64-freetype.py --control "$control" 2>&1 | tee -a freetype-bridge-asan.log
          done
      - name: Register and execute the complete native64 Freetype interface
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/font-host-tools" sh makemk.sh
          python3 utils/tests/native64-freetype-register.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee freetype-register-asan.log
      - name: Check complete native64 Draw geometry
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-geometry.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee geometry-asan.log
      - name: Check complete Draw consumer and real scalar libraries
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-draw-scalars.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee draw-scalars-asan.log
      - name: Check pixel extents, protocol and VM byte-array boundaries
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-pixels.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee pixels-asan.log
      - name: Preserve complete sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-address-asan-${{ matrix.arch }}
          path: |
            utf-asan.log
            binding-asan.log
            loader-mode-asan.log
            draw-init-asan.log
            loader-init-asan.log
            loader-branch-asan.log
            loader-snapshots-asan.log
            graphics-init-asan.log
            gui-type-maps-asan.log
            freetype-bridge-asan.log
            freetype-register-asan.log
            geometry-asan.log
            draw-scalars-asan.log
            pixels-asan.log
          if-no-files-found: warn
          retention-days: 14
