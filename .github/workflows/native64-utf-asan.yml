name: Native64 UTF and binding address checks
on:
  push:
    branches: [experiment]
    paths:
      - '.github/workflows/native64-utf-asan.yml'
      - 'libinterp/runt.c'
      - 'libinterp/tests/sys-utf.c'
      - 'libinterp/tests/sys-utf.py'
      - 'include/interp.h'
      - 'include/runt.h'
      - 'lib9/rune.c'
      - 'libinterp/disc.c'
      - 'utils/tests/native64-disc-binding.c'
      - 'utils/tests/native64-disc-binding.py'
      - 'libinterp/draw.c'
      - 'utils/tests/native64-draw-init.c'
      - 'utils/tests/native64-draw-init.py'
      - 'utils/tests/native64-builtins.py'
      - 'libinterp/loader.c'
      - 'utils/tests/native64-loader-mode.c'
      - 'utils/tests/native64-loader-mode.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utf:
    name: Address ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the native C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Execute full optimized UTF oracle and wrong-count controls
        env:
          CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          uname -a
          python3 libinterp/tests/sys-utf.py 2>&1 | tee utf-asan.log
      - name: Execute static binding memory and refusal controls
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-disc-binding.py 2>&1 | tee binding-asan.log
          for control in mode jit image; do
            python3 utils/tests/native64-disc-binding.py --control "$control" 2>&1 | tee -a binding-asan.log
          done
      - name: Execute public Loader result and mode checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-mode.py 2>&1 | tee loader-mode-asan.log
          python3 utils/tests/native64-loader-mode.py --control 2>&1 | tee -a loader-mode-asan.log
      - name: Execute transactional Draw initialization checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-draw-init.py 2>&1 | tee draw-init-asan.log
          for control in retirement publication registration; do
            python3 utils/tests/native64-draw-init.py --control "$control" 2>&1 | tee -a draw-init-asan.log
          done
      - name: Preserve complete sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-address-asan-${{ matrix.arch }}
          path: |
            utf-asan.log
            binding-asan.log
            loader-mode-asan.log
            draw-init-asan.log
          if-no-files-found: warn
          retention-days: 14
