name: Native64 UTF and binding address checks
on:
  push:
    branches: [experiment]
    paths:
      - '.github/workflows/native64-utf-asan.yml'
      - 'libinterp/runt.c'
      - 'libinterp/tests/sys-utf.c'
      - 'libinterp/tests/sys-utf.py'
      - 'include/dis64*.h'
      - 'utils/tests/dis64-call-*'
      - 'utils/tests/dis64-file-calls*'
      - 'libinterp/tests/dis64-fileloader*'
      - 'libinterp/tests/dis64-scheduler*'
      - 'libinterp/readmod.c'
      - 'libinterp/load.c'
      - 'emu/port/main.c'
      - 'utils/tests/goldens/dis64-calls/**'
      - 'utils/tests/goldens/dis64-infer/**'
      - 'utils/tests/goldens/dis64-construct/**'
      - 'utils/tests/native64-result-calls*'
      - 'libinterp/xec.c'
      - 'libinterp/load64.c'
      - 'libinterp/tests/dis64-runtime.c'
      - 'include/interp.h'
      - 'include/runt.h'
      - 'lib9/rune.c'
      - 'libinterp/disc.c'
      - 'utils/tests/native64-disc-binding.c'
      - 'utils/tests/native64-disc-binding.py'
      - 'libinterp/prefab.c'
      - 'libinterp/freetype.c'
      - 'libfreetype/**'
      - 'limbo/**'
      - 'makemk.sh'
      - 'libinterp/geom.c'
      - 'module/draw-native64.m'
      - 'utils/tests/native64-geometry*'
      - 'utils/tests/native64-draw-scalars.py'
      - 'utils/tests/native64-pixels*'
      - 'utils/tests/native64-polygons*'
      - 'utils/tests/native64-curves*'
      - 'utils/tests/native64-primitives*'
      - 'utils/tests/native64-text*'
      - 'utils/tests/native64-channels*'
      - 'utils/tests/dis64-peer-schema.py'
      - 'utils/tests/native64-draw-owners*'
      - 'utils/tests/native64-display-allocate*'
      - 'utils/tests/native64-bezier-consumers*'
      - 'utils/tests/dis64-peer-semantics.py'
      - 'utils/tests/dis64-storage-image*'
      - 'utils/dis64_storage.py'
      - 'utils/tests/dis64-python-storage.py'
      - 'utils/tests/dis64-storage-owner*'
      - 'utils/tests/dis64-storage-clone*'
      - 'utils/tests/dis64-storage-attach*'
      - 'utils/tests/dis64-numeric-*'
      - 'utils/tests/native64-module-mptype*'
      - 'utils/tests/native64-draw-attach.c'
      - 'utils/tests/native64-draw-info.py'
      - 'utils/tests/native64-draw-mix*'
      - 'utils/tests/dis64-peer-binding.py'
      - 'utils/tests/native64-draw-init*'
      - 'utils/tests/native64-refresh*'
      - 'utils/tests/native64-display-close*'
      - 'include/draw.h'
      - 'libdraw/**'
      - 'fonts/**/*.font'
      - 'libmemdraw/**'
      - 'module/freetype-native64.m'
      - 'module/freetype.m'
      - 'module/draw.m'
      - 'module/sys.m'
      - 'include/native64-scalar-boot.h'
      - 'include/freetype/**'
      - 'utils/tests/native64-freetype*'
      - 'libinterp/tests/gui-type-maps.c'
      - 'libinterp/tests/gui-type-maps.py'
      - 'libinterp/tests/draw-windows.py'
      - 'libinterp/tests/draw-windows.c'
      - 'utils/tests/native64-graphics-init.c'
      - 'utils/tests/native64-graphics-init.py'
      - 'libinterp/draw.c'
      - 'emu/port/devdraw.c'
      - 'utils/tests/native64-draw-init.c'
      - 'utils/tests/native64-draw-init.py'
      - 'utils/tests/native64-builtins.py'
      - 'libinterp/tests/loader-snapshots.c'
      - 'libinterp/tests/loader-snapshots.py'
      - 'utils/tests/native64-loader-branch.c'
      - 'utils/tests/native64-loader-branch.py'
      - 'utils/tests/native64-loader-init.c'
      - 'utils/tests/native64-loader-init.py'
      - 'libinterp/loader.c'
      - 'utils/tests/native64-loader-mode.c'
      - 'utils/tests/native64-loader-mode.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utf:
    name: Address ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the native C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Execute full optimized UTF oracle and wrong-count controls
        env:
          CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          uname -a
          python3 libinterp/tests/sys-utf.py 2>&1 | tee utf-asan.log
      - name: Execute static binding memory and refusal controls
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-disc-binding.py 2>&1 | tee binding-asan.log
          for control in mode jit image; do
            python3 utils/tests/native64-disc-binding.py --control "$control" 2>&1 | tee -a binding-asan.log
          done
      - name: Execute public Loader result and mode checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-mode.py 2>&1 | tee loader-mode-asan.log
          python3 utils/tests/native64-loader-mode.py --control 2>&1 | tee -a loader-mode-asan.log
      - name: Execute transactional Draw initialization checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-draw-init.py 2>&1 | tee draw-init-asan.log
          for control in retirement publication registration; do
            python3 utils/tests/native64-draw-init.py --control "$control" 2>&1 | tee -a draw-init-asan.log
          done
      - name: Execute transactional Loader initialization checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-init.py 2>&1 | tee loader-init-asan.log
          for control in retirement publication registration; do
            python3 utils/tests/native64-loader-init.py --control "$control" 2>&1 | tee -a loader-init-asan.log
          done
      - name: Execute checked Loader branch snapshots
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-loader-branch.py 2>&1 | tee loader-branch-asan.log
          for control in width bounds; do
            python3 utils/tests/native64-loader-branch.py --control "$control" 2>&1 | tee -a loader-branch-asan.log
          done
      - name: Execute public Loader snapshot rollback
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 libinterp/tests/loader-snapshots.py 2>&1 | tee loader-snapshots-asan.log
      - name: Execute native graphical descriptor and ownership checks
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          for module in prefab freetype; do
            python3 utils/tests/native64-graphics-init.py --module "$module" 2>&1 | tee -a graphics-init-asan.log
            for control in retirement publication registration; do
              python3 utils/tests/native64-graphics-init.py --module "$module" --control "$control" 2>&1 | tee -a graphics-init-asan.log
            done
          done
          for control in face-map glyph-map; do
            python3 utils/tests/native64-graphics-init.py --module freetype --control "$control" 2>&1 | tee -a graphics-init-asan.log
          done
          python3 libinterp/tests/gui-type-maps.py 2>&1 | tee gui-type-maps-asan.log
      - name: Execute native Freetype transforms, rasters and vendored engine
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-freetype.py 2>&1 | tee freetype-bridge-asan.log
          for control in vm-transform native-transform pitch limits result sort; do
            python3 utils/tests/native64-freetype.py --control "$control" 2>&1 | tee -a freetype-bridge-asan.log
          done
      - name: Register and execute the complete native64 Freetype interface
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/font-host-tools" sh makemk.sh
          python3 utils/tests/native64-freetype-register.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee freetype-register-asan.log
      - name: Check complete native64 Draw geometry
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-geometry.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee geometry-asan.log
      - name: Check complete Draw consumer and real scalar libraries
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-draw-scalars.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee draw-scalars-asan.log
      - name: Check pixel extents, protocol and VM byte-array boundaries
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-pixels.py --limbo "$RUNNER_TEMP/font-host-tools/limbo" 2>&1 | tee pixels-asan.log
      - name: Check fragmented refresh records and native buffer/queue ownership
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-refresh.py 2>&1 | tee refresh-asan.log
      - name: Check native Display cancellation and close resource ownership
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-display-close.py 2>&1 | tee display-close-asan.log
      - name: Check immutable complete call images through private C and RX execution
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/dis64-call-goldens.py 2>&1 | tee call-goldens-asan.log
      - name: Preserve complete sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-address-asan-${{ matrix.arch }}
          path: |
            utf-asan.log
            binding-asan.log
            loader-mode-asan.log
            draw-init-asan.log
            loader-init-asan.log
            loader-branch-asan.log
            loader-snapshots-asan.log
            graphics-init-asan.log
            gui-type-maps-asan.log
            freetype-bridge-asan.log
            freetype-register-asan.log
            geometry-asan.log
            draw-scalars-asan.log
            pixels-asan.log
            refresh-asan.log
            display-close-asan.log
            call-goldens-asan.log
          if-no-files-found: warn
          retention-days: 14

  call-inference:
    name: Raw Dis64 inference ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Infer scalar locals from immutable raw bytes and execute actual C and RX
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/dis64-call-infer.py 2>&1 | tee call-inference-asan.log
      - name: Preserve inference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-call-inference-${{ matrix.arch }}
          path: call-inference-asan.log
          if-no-files-found: warn
          retention-days: 14

  call-construction:
    name: Actual Dis64 construction ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Construct owned scalar-call Modules and check every allocation failure
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/dis64-call-construct.py 2>&1 | tee call-construction-asan.log
          python3 utils/tests/dis64-file-calls.py 2>&1 | tee file-calls-asan.log
          for control in cache seal proof-route; do
            python3 utils/tests/dis64-file-calls.py --control "$control" 2>&1 | tee -a file-calls-asan.log
          done
      - name: Preserve constructor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-call-construction-${{ matrix.arch }}
          path: |
            call-construction-asan.log
            file-calls-asan.log
          if-no-files-found: warn
          retention-days: 14

  polygons:
    name: Draw polygons ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap native compiler for fresh Draw Frame64 declarations
        run: MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/polygon-host-tools" sh makemk.sh
      - name: Check owning scheduler and file constructor source closure
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=undefined -fno-sanitize-recover=all'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-live-vm.py 2>&1 | tee polygon-live-vm.log
      - name: Check actual polygon packets and curve allocation retirement
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-polygons.py --limbo "$RUNNER_TEMP/polygon-host-tools/limbo" 2>&1 | tee polygons-asan.log
      - name: Check nonzero bounded curves and independent exact integer geometry
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-curves.py 2>&1 | tee curves-asan.log
      - name: Preserve polygon diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-polygons-${{ matrix.arch }}
          path: |
            polygons-asan.log
            curves-asan.log
            polygon-live-vm.log
          if-no-files-found: warn
          retention-days: 14

  primitives:
    name: Draw primitives ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler for owning Frame64 declarations
        run: MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/primitive-host-tools" sh makemk.sh
      - name: Check exact native packets and fifteen actual Frame64 consumers
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-primitives.py --limbo "$RUNNER_TEMP/primitive-host-tools/limbo" 2>&1 | tee primitives-asan.log
      - name: Preserve primitive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-primitives-${{ matrix.arch }}
          path: primitives-asan.log
          if-no-files-found: warn
          retention-days: 14

  text:
    name: Draw text ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler for owning text Frame64 declarations
        run: MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/text-host-tools" sh makemk.sh
      - name: Check actual cache hits, text packets, widths and five Frame64 consumers
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-text.py --limbo "$RUNNER_TEMP/text-host-tools/limbo" 2>&1 | tee text-asan.log
      - name: Preserve text diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-text-${{ matrix.arch }}
          path: text-asan.log
          if-no-files-found: warn
          retention-days: 14

  draw-owners:
    name: Draw owners ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler for owning resource Frame64 declarations
        run: MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/draw-owner-tools" sh makemk.sh
      - name: Check private descriptor rollback and guarded native registration
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-draw-init.py 2>&1 | tee draw-owner-init.log
          for control in retirement publication registration; do
            python3 utils/tests/native64-draw-init.py --control "$control" 2>&1 | tee -a draw-owner-init.log
          done
          python3 libinterp/tests/gui-type-maps.py 2>&1 | tee draw-owner-maps.log
          CFLAGS="$NATIVE64_CFLAGS" python3 libinterp/tests/draw-windows.py 2>&1 | tee draw-owner-windows.log
          python3 utils/tests/native64-draw-owners.py --limbo "$RUNNER_TEMP/draw-owner-tools/limbo" 2>&1 | tee draw-owners-asan.log
      - name: Preserve resource ownership diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-draw-owners-${{ matrix.arch }}
          path: |
            draw-owner-init.log
            draw-owner-maps.log
            draw-owner-windows.log
            draw-owners-asan.log
          if-no-files-found: warn
          retention-days: 14

  channels:
    name: Channels and full subfont paths ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler for the owning channel Frame64 declarations
        run: MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/channel-tools" sh makemk.sh
      - name: Check protocol width, actual String owners and complete file paths
        env:
          NATIVE64_ARCH: ${{ matrix.arch }}
          NATIVE64_CFLAGS: '-O3 -g -DNDEBUG -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -DNATIVE64_TEST_PORT_ALIASES=1'
        run: |
          set -euo pipefail
          python3 utils/tests/native64-channels.py --limbo "$RUNNER_TEMP/channel-tools/limbo" 2>&1 | tee channels-asan.log
      - name: Preserve channel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native64-channels-${{ matrix.arch }}
          path: channels-asan.log
          if-no-files-found: warn
          retention-days: 14

  attach:
    name: Fresh window ownership and Image initialization ASan ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
