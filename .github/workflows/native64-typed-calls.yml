name: Native64 source-derived module calls
on:
  push:
    branches: [experiment]
    paths:
      - '.github/workflows/native64-typed-calls.yml'
      - 'makemk.sh'
      - 'mkfiles/**'
      - 'Linux/**'
      - 'Android/**'
      - 'limbo/**'
      - 'module/**'
      - 'include/**'
      - 'libinterp/**'
      - 'emu/port/**'
      - 'utils/tests/native64-local-calls.*'
      - 'utils/tests/native64-typed*'
      - 'utils/tests/dis64-typed*'
      - 'utils/tests/dis64-command*'
      - 'appl/cmd/sh/sh.y'
      - 'utils/tests/awm-native64-*'
      - 'utils/tests/dis64-layout.py'
      - 'utils/tests/native64-callsites.py'
      - 'utils/tests/classic-array-initializers.py'
      - 'appl/wm/awm.b'
      - 'appl/wm/atoolbar.b'
      - 'appl/lib/**'
      - 'appl/cmd/emuinit.b'
      - 'appl/cmd/sh/sh.b'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native64-typed-calls-${{ github.ref }}
  cancel-in-progress: false # Finish the active typed matrix; retain the latest pending source batch.
jobs:
  calls:
    name: Typed module calls ${{ matrix.arch }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host: ubuntu-22.04
            compiler: gcc
            runner: ''
            flags: '-O2 -g -DNDEBUG -fno-strict-aliasing -fsanitize=undefined -fno-sanitize-recover=all'
          - arch: arm64
            host: ubuntu-22.04-arm
            compiler: gcc
            runner: ''
            flags: '-O2 -g -DNDEBUG -fno-strict-aliasing -fsanitize=undefined -fno-sanitize-recover=all'
          - arch: riscv64
            host: ubuntu-22.04
            compiler: riscv64-linux-gnu-gcc
            runner: 'qemu-riscv64 -R 0x10000000000 -L /usr/riscv64-linux-gnu'
            flags: '-O2 -g -DNDEBUG -fno-strict-aliasing'
    env:
      NATIVE64_ARCH: ${{ matrix.arch }}
      NATIVE64_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap native compiler and target tools
        run: |
          if [ "$NATIVE64_ARCH" = arm64 ]; then
            test "$(uname -m)" = aarch64
          fi
          if [ "$NATIVE64_ARCH" = riscv64 ]; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
          fi
          MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/host-tools" sh makemk.sh
      - name: Execute RV64 numeric table emitter and cache proofs on the host
        if: matrix.arch == 'riscv64'
        env:
          CC: gcc
          CFLAGS: '-O1 -g -fno-strict-aliasing -fsanitize=undefined -fno-sanitize-recover=all'
        run: |
          python3 -m pip install --disable-pip-version-check unicorn==2.1.4
          python3 libinterp/tests/riscv-tables.py
          python3 libinterp/tests/riscv-runtime.py
          python3 libinterp/tests/riscv-cache.py
      - name: Check Limbo Command interface aliases and managed calls
        env:
          CC: ${{ matrix.compiler }}
          NATIVE64_CFLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/typed-call-logs"
          python3 utils/tests/dis64-command-alias.py --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/command-alias.log"
          python3 utils/tests/dis64-command.py --limbo "$RUNNER_TEMP/host-tools/limbo" --implementation Wm \
            --case consume-two --case callee-cons --case source-context --case load-no-init --case explicit-init-error --case local-once 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/command-alias-gc.log"
          python3 utils/tests/dis64-command.py --limbo "$RUNNER_TEMP/host-tools/limbo" --implementation Wm --chain \
            --case chain-scalar --case chain-owned --case chain-command 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/command-alias-chain.log"
      - name: Construct and clone real AWM startup data
        env:
          CC: ${{ matrix.compiler }}
          NATIVE64_CFLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/typed-call-logs"
          python3 utils/tests/awm-native64-data.py --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/awm-data.log"
          for control in scalar map clone; do
            python3 utils/tests/awm-native64-data.py --limbo "$RUNNER_TEMP/host-tools/limbo" \
              --source appl/wm/awm.b --control "$control" 2>&1 \
              | tee "$RUNNER_TEMP/typed-call-logs/awm-data-$control.log"
          done
          for control in array-map array-clone array-value; do
            source=appl/lib/titlebar.b
            if [ "$control" = array-value ]; then source=appl/cmd/sh/sh.b; fi
            python3 utils/tests/awm-native64-data.py --limbo "$RUNNER_TEMP/host-tools/limbo" \
              --source "$source" --control "$control" 2>&1 \
              | tee "$RUNNER_TEMP/typed-call-logs/awm-data-$control.log"
          done
      - name: Execute source-derived typed calls and active refusal controls
        env:
          CC: ${{ matrix.compiler }}
          NATIVE64_CFLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/typed-call-logs"
          for gate in tables string-tables string-imports loads files calls tail local multi module external imports; do
            python3 "utils/tests/native64-typed-$gate.py" --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
              | tee "$RUNNER_TEMP/typed-call-logs/$gate.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-module-calls-${{ matrix.arch }}
          path: ${{ runner.temp }}/typed-call-logs
          if-no-files-found: warn
          retention-days: 14
  bionic:
    name: Typed module calls Android ARM64 Bionic
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      NATIVE64_ARCH: arm64
      NATIVE64_RUNNER: qemu-aarch64
      NATIVE64_CFLAGS: '-O2 -g -DNDEBUG -fno-strict-aliasing -static'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Android toolchain and native compiler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-user
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          echo "59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc  $RUNNER_TEMP/ndk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/host-tools" sh makemk.sh
      - name: Verify Bionic headers and native pointer width
        run: |
          clang="$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          printf '%s\n' '#include <sys/cdefs.h>' '#include <stdio.h>' \
            '#ifndef __BIONIC__' '#error Android Bionic headers required' '#endif' \
            'int main(void){if(sizeof(void*)!=8 || sizeof(int)!=4)return 1;puts("PASS ARM64/Bionic pointer64 int32");return 0;}' \
            > "$RUNNER_TEMP/bionic-probe.c"
          "$clang" -O2 -static "$RUNNER_TEMP/bionic-probe.c" -o "$RUNNER_TEMP/bionic-probe"
          qemu-aarch64 "$RUNNER_TEMP/bionic-probe"
      - name: Check Limbo Command interface aliases and managed calls against Bionic
        run: |
          set -o pipefail
          export CC="$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang -I$GITHUB_WORKSPACE/Android/arm64/include -I$GITHUB_WORKSPACE/Android/arm/include"
          mkdir -p "$RUNNER_TEMP/typed-call-logs"
          python3 utils/tests/dis64-command-alias.py --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/command-alias.log"
          python3 utils/tests/dis64-command.py --limbo "$RUNNER_TEMP/host-tools/limbo" --implementation Wm \
            --case consume-two --case callee-cons --case source-context --case load-no-init --case explicit-init-error --case local-once 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/command-alias-gc.log"
          python3 utils/tests/dis64-command.py --limbo "$RUNNER_TEMP/host-tools/limbo" --implementation Wm --chain \
            --case chain-scalar --case chain-owned --case chain-command 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/command-alias-chain.log"
      - name: Construct and clone real AWM startup data against ARM64 Bionic
        run: |
          set -o pipefail
          export CC="$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang -I$GITHUB_WORKSPACE/Android/arm64/include -I$GITHUB_WORKSPACE/Android/arm/include"
          mkdir -p "$RUNNER_TEMP/typed-call-logs"
          python3 utils/tests/awm-native64-data.py --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
            | tee "$RUNNER_TEMP/typed-call-logs/awm-data.log"
          for control in scalar map clone; do
            python3 utils/tests/awm-native64-data.py --limbo "$RUNNER_TEMP/host-tools/limbo" \
              --source appl/wm/awm.b --control "$control" 2>&1 \
              | tee "$RUNNER_TEMP/typed-call-logs/awm-data-$control.log"
          done
          for control in array-map array-clone array-value; do
            source=appl/lib/titlebar.b
            if [ "$control" = array-value ]; then source=appl/cmd/sh/sh.b; fi
            python3 utils/tests/awm-native64-data.py --limbo "$RUNNER_TEMP/host-tools/limbo" \
              --source "$source" --control "$control" 2>&1 \
              | tee "$RUNNER_TEMP/typed-call-logs/awm-data-$control.log"
          done
      - name: Execute typed calls and refusal controls against ARM64 Bionic
        run: |
          set -o pipefail
          export CC="$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang -I$GITHUB_WORKSPACE/Android/arm64/include -I$GITHUB_WORKSPACE/Android/arm/include"
          mkdir -p "$RUNNER_TEMP/typed-call-logs"
          for gate in tables string-tables string-imports loads files calls tail local multi module external imports; do
            python3 "utils/tests/native64-typed-$gate.py" --limbo "$RUNNER_TEMP/host-tools/limbo" 2>&1 \
              | tee "$RUNNER_TEMP/typed-call-logs/$gate.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-module-calls-android-arm64-bionic
          path: ${{ runner.temp }}/typed-call-logs
          if-no-files-found: warn
          retention-days: 14
