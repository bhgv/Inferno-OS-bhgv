name: Android ARM64 GUI native link (AWM pending)
on:
  push:
    branches: [experiment]
    paths:
      - '.github/workflows/android-arm64-gui.yml'
      - 'utils/tests/android-gui-build.py'
      - 'utils/tests/native64-tk-register.*'
      - 'utils/tests/native64-draw-register.*'
      - 'utils/tests/native64-sys-fixed.*'
      - 'utils/tests/native64-prefix.*'
      - 'utils/tests/native64-arguments.*'
      - 'utils/tests/native64-result.*'
      - 'utils/tests/native64-gc.*'
      - 'utils/tests/native64-*format*'
      - 'utils/tests/native64-sys-write.c'
      - 'utils/tests/dis64-numeric-*'
      - 'utils/tests/dis64-managed-*'
      - 'libinterp/tests/dis64-runtime.*'
      - 'module/draw-native64.m'
      - 'module/gui-native64.m'
      - 'module/tk-native64.m'
      - 'module/tk.m'
      - 'module/draw.m'
      - 'module/sys.m'
      - 'emu/Android/**'
      - 'emu/port/**'
      - 'include/**'
      - 'libdraw/**'
      - 'libtk/**'
      - 'libinterp/**'
      - 'libfreetype/**'
      - 'mkfiles/**'
      - 'utils/configure.py'
      - 'limbo/**'
      - 'doc/dis64-native64-prefixes.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-arm64-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-gui:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bhgv/Inferno-OS_Android
          ref: ed8b80ecb64524c86ca1bd2b21e1abbfb494473f
          path: android-app
      - name: Prepare pinned NDK and native build tools
        run: |
          python3 -m pip install --user cmake==4.4.4 ninja==1.13.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          echo "59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc  $RUNNER_TEMP/ndk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          MKBOOTSTRAP_LIMBO=1 MKBOOTSTRAP_BINDIR="$RUNNER_TEMP/host-tools" sh makemk.sh
          if ! command -v qemu-aarch64 >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-user
          fi
      - name: Check real Android objects and GUI ownership
        run: |
          python3 utils/tests/host64-android.py --ndk "$RUNNER_TEMP/android-ndk-r27c"
          python3 libdraw/tests/screen-channel.py
          python3 utils/tests/native64-tk-register.py --limbo "$RUNNER_TEMP/host-tools/limbo"
          python3 utils/tests/native64-draw-register.py --limbo "$RUNNER_TEMP/host-tools/limbo"
          python3 utils/tests/native64-sys-fixed.py --limbo "$RUNNER_TEMP/host-tools/limbo"
          python3 utils/tests/native64-prefix.py --limbo "$RUNNER_TEMP/host-tools/limbo"
          python3 android-app/tests/framebuffer-lifecycle.py
          python3 android-app/tests/framebuffer-startup.py
          python3 android-app/tests/framebuffer-pixels.py
          python3 android-app/tests/cmake-abis.py
      - name: Execute ARM64 Bionic managed C and JIT with collection
        run: |
          set -o pipefail
          NATIVE64_RUNNER=qemu-aarch64 python3 utils/tests/dis64-numeric-gc.py \
            --managed --limbo "$RUNNER_TEMP/host-tools/limbo" \
            --android-ndk "$RUNNER_TEMP/android-ndk-r27c" 2>&1 \
            | tee "$RUNNER_TEMP/bionic-managed.log"
      - name: Execute typed Sys formatter gateways against ARM64 Bionic
        run: |
          set -o pipefail
          NATIVE64_RUNNER=qemu-aarch64 python3 utils/tests/native64-arguments.py \
            --formatter --limbo "$RUNNER_TEMP/host-tools/limbo" \
            --android-ndk "$RUNNER_TEMP/android-ndk-r27c" 2>&1 \
            | tee "$RUNNER_TEMP/bionic-sys-format.log"
      - name: Compile full Draw/Tk core and link ordinary NativeActivity
        run: |
          python3 utils/tests/android-gui-build.py --ndk "$RUNNER_TEMP/android-ndk-r27c" \
            --host-tools "$RUNNER_TEMP/host-tools" --app-root "$GITHUB_WORKSPACE/android-app" \
            --build-root "$RUNNER_TEMP/android-gui"
      - name: Link full GUI with native64 Draw/Tk and fixed Sys frames
        run: |
          python3 utils/tests/android-gui-build.py --ndk "$RUNNER_TEMP/android-ndk-r27c" \
            --host-tools "$RUNNER_TEMP/host-tools" --app-root "$GITHUB_WORKSPACE/android-app" \
            --build-root "$RUNNER_TEMP/android-gui-tk" --native64-tk --native64-draw --native64-sys-fixed --native64-formatter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-arm64-GUI-native-link-not-AWM-APK
          path: |
            ${{ runner.temp }}/bionic-managed.log
            ${{ runner.temp }}/bionic-sys-format.log
            ${{ runner.temp }}/android-gui/logs/
            ${{ runner.temp }}/android-gui/result.json
            ${{ runner.temp }}/android-gui/native/libinferno_os_app.so
            ${{ runner.temp }}/android-gui-tk/logs/
            ${{ runner.temp }}/android-gui-tk/result.json
            ${{ runner.temp }}/android-gui-tk/native/libinferno_os_app.so
          if-no-files-found: warn
          retention-days: 14
